<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <div class="container-fluid">

            <!-- Logo / Brand -->
            <a class="navbar-brand fw-bold" href="#">
                Student Portal
            </a>

            <!-- Navbar Toggler -->
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu"
                aria-controls="navbarMenu"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>

            <!-- Navbar Menu -->
            <div class="collapse navbar-collapse" id="navbarMenu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="#">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Students
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Courses
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Contact
                        </a>
                    </li>

                </ul>

            </div>

        </div>
    </nav>


    <!-- Main Content -->
    <div class="container-fluid min-vh-100" >

        <div class="row justify-content-center align-items-center min-vh-100 pt-5">

            <!-- Left 3 Columns -->
            <div class="col-12 col-md-3">
                <!-- Future content -->
            </div>


            <!-- Middle 6 Columns -->
            <div class="col-12 col-md-6">

                <!-- Registration Card -->
                <div class="card shadow-lg border-0">

                    <!-- Card Header -->
                    <div class="card-header bg-primary text-white text-center">
                        <h3 class="mb-0">
                            Student Registration
                        </h3>
                    </div>

                    <!-- Card Body -->
                    <div class="card-body p-4">

                        <form name="Registration" action="StudentController" method="post">

                            <!-- Student Name -->
                            <div class="mb-3">
                                <label for="studentName" class="form-label">
                                    Student Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="username"
                                    name="username"
                                    placeholder="Enter student name"
                                    required
                                >
                            </div>


                            <!-- Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    placeholder="Enter email"
                                    required
                                >
                            </div>


                            <!-- Mobile Number -->
                            <div class="mb-3">
                                <label for="mobile" class="form-label">
                                    Mobile Number
                                </label>

                                <input
                                    type="tel"
                                    class="form-control"
                                    id="mobilenumber"
                                    name="mobilenumber"
                                    placeholder="Enter mobile number"
                                    required
                                >
                            </div>


                            <!-- Gender -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Gender
                                </label>

                                <div>

                                    <div class="form-check form-check-inline">

                                        <input
                                            class="form-check-input"
                                            type="radio"
                                            name="gender"
                                            id="male"
                                            value="Male"
                                            required
                                        >

                                        <label
                                            class="form-check-label"
                                            for="male">
                                            Male
                                        </label>

                                    </div>


                                    <div class="form-check form-check-inline">

                                        <input
                                            class="form-check-input"
                                            type="radio"
                                            name="gender"
                                            id="female"
                                            value="Female"
                                        >

                                        <label
                                            class="form-check-label"
                                            for="female">
                                            Female
                                        </label>

                                    </div>


                                    <div class="form-check form-check-inline">

                                        <input
                                            class="form-check-input"
                                            type="radio"
                                            name="gender"
                                            id="other"
                                            value="Other"
                                        >

                                        <label
                                            class="form-check-label"
                                            for="other">
                                            Other
                                        </label>

                                    </div>

                                </div>

                            </div>


                            <!-- Course -->
                            <div class="mb-3">

                                <label for="course" class="form-label">
                                    Course
                                </label>

                                <select
                                    class="form-select"
                                    id="course"
                                    name="course"
                                    required
                                >

                                    <option value="" selected disabled>
                                        Select Course
                                    </option>

                                    <option value="Java">
                                        Java
                                    </option>

                                    <option value="Python">
                                        Python
                                    </option>

                                    <option value="Web Development">
                                        Web Development
                                    </option>

                                    <option value="Data Science">
                                        Data Science
                                    </option>

                                    <option value="Artificial Intelligence">
                                        Artificial Intelligence
                                    </option>

                                </select>

                            </div>


                            <!-- City -->
                            <div class="mb-3">

                                <label for="city" class="form-label">
                                    City
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="city"
                                    name="city"
                                    placeholder="Enter city"
                                    required
                                >

                            </div>


                            <!-- Register Button -->
                            <div class="d-grid">

                                <button
                                    type="submit"
                                    class="btn btn-primary">
                                    Register
                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>


            <!-- Right 3 Columns -->
            <div class="col-12 col-md-3">
                <!-- Future content -->
            </div>

        </div>

    </div>


    <!-- Bootstrap 5 JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
